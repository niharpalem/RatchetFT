{% extends "base.html" %}
{% block title %}Bake-off · {{ sw.task }} · RatchetFT{% endblock %}
{% block main %}
<div class="flex-1 flex flex-col min-w-0">
  <header class="border-b border-zinc-200 bg-white px-6 py-4">
    <div class="flex items-start justify-between gap-4">
      <div class="min-w-0">
        <div class="text-[11px] uppercase tracking-wide text-zinc-400">Model bake-off</div>
        <h1 class="text-lg font-semibold tracking-tight truncate">{{ sw.task }}</h1>
        <div id="shared-ds" class="mt-1 text-xs text-zinc-500 font-mono">
          {% if sw.dataset_id %}shared dataset · {{ sw.dataset_id }}{% endif %}
        </div>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <span id="status-pill" class="rounded-full bg-zinc-100 px-3 py-1 text-xs font-medium text-zinc-600">{{ sw.status }}</span>
        <label class="flex items-center gap-1.5 text-xs text-zinc-500">max loops
          <input id="max-loops" type="number" min="1" max="8" value="4"
            class="w-14 rounded-lg border border-zinc-300 px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900"/></label>
        <button id="run-btn" class="rounded-xl bg-zinc-900 text-white px-4 py-2 text-sm font-medium hover:bg-zinc-800">
          {% if sw.status == 'done' %}Re-run bake-off{% else %}Run bake-off &rarr;{% endif %}
        </button>
      </div>
    </div>
  </header>

  <div class="flex-1 overflow-y-auto p-6">
    <div id="winner" class="hidden mb-5 max-w-5xl"></div>
    <div id="grid" class="grid gap-4" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));"></div>
  </div>
</div>

<script>
const SID = {{ sw.swarm_id | tojson }};
const SW  = {{ sw | tojson }};
const $grid = document.getElementById("grid");
const $winner = document.getElementById("winner");
const $status = document.getElementById("status-pill");
const $btn = document.getElementById("run-btn");
const $sharedDs = document.getElementById("shared-ds");
const pct = v => v==null ? "—" : Math.round(v*100) + "%";
const barColor = v => v >= 0.85 ? "bg-emerald-500" : v >= 0.6 ? "bg-amber-400" : "bg-rose-500";

let slots = {};   // slot -> {model, gpu, el, best}

function colHTML(c) {
  return `
    <div class="rf-in rf-card rounded-xl border border-zinc-200 bg-white p-4" data-slot="${c.slot}">
      <div class="text-sm font-semibold truncate" title="${c.label || c.model}">${c.label || c.model.split('/').pop()}</div>
      <div class="text-[11px] text-zinc-400 font-mono truncate" title="${c.model}">${c.model.split('/').pop()}${c.params_b!=null?' · '+c.params_b+'B':''}${c.gpu?' · '+c.gpu:''}</div>
      <div class="status mt-2 text-[11px] text-zinc-500">pending…</div>
      <div class="mt-3 flex items-end gap-3">
        <div><div class="text-[10px] text-zinc-400 uppercase">best val</div>
             <div class="bestval text-xl font-semibold tabular-nums">—</div></div>
        <div><div class="text-[10px] text-zinc-400 uppercase">test</div>
             <div class="test text-xl font-semibold tabular-nums text-emerald-600">—</div></div>
      </div>
      <div class="bars mt-3 space-y-1"></div>
      <div class="badge mt-3"></div>
    </div>`;
}

function renderGrid(contenders) {
  $grid.innerHTML = contenders.map(colHTML).join("");
  slots = {};
  for (const c of contenders) {
    slots[c.slot] = {model: c.model, best: c.best_val ?? null, el: $grid.querySelector(`[data-slot="${c.slot}"]`)};
    if (c.best_val != null) setVal(c.slot, "bestval", pct(c.best_val));
    if (c.best_test != null) setVal(c.slot, "test", pct(c.best_test));
    if (c.status === "done") setStatusLine(c.slot, "done");
  }
}
function q(slot, sel){ return slots[slot] && slots[slot].el.querySelector(sel); }
function setVal(slot, cls, v){ const e=q(slot, "."+cls); if(e) e.textContent=v; }
function setStatusLine(slot, t){ const e=q(slot, ".status"); if(e) e.textContent=t; }
function setBars(slot, per_label){
  const e=q(slot, ".bars"); if(!e) return;
  e.innerHTML = Object.entries(per_label).sort((a,b)=>a[1]-b[1]).map(([k,v])=>`
    <div class="flex items-center gap-2 text-[11px]">
      <div class="w-16 truncate text-zinc-500">${k}</div>
      <div class="flex-1 h-1.5 rounded-full bg-zinc-100 overflow-hidden"><div class="h-full ${barColor(v)}" style="width:${Math.round(v*100)}%"></div></div>
      <div class="w-8 text-right tabular-nums text-zinc-500">${Math.round(v*100)}</div>
    </div>`).join("");
}

function run() {
  $btn.disabled = true; $btn.textContent = "running…";
  $winner.classList.add("hidden"); $winner.innerHTML = "";
  $status.textContent = "researching…";
  const maxLoops = Math.max(1, Math.min(8, parseInt(document.getElementById("max-loops").value)||4));
  const es = new EventSource(`/swarm/${SID}/stream?max_iters=${maxLoops}`);

  es.addEventListener("swarm_start", e => {
    const d = JSON.parse(e.data);
    $sharedDs.textContent = "shared dataset · " + d.dataset_id;
    renderGrid(d.contenders);
    $status.textContent = "training…";
  });
  es.addEventListener("progress", e => {
    const d = JSON.parse(e.data);
    if (d.phase === "train") setStatusLine(d.slot, `training · step ${d.step}/${d.total} · loss ${d.loss}`);
    else if (d.phase === "evaluating") setStatusLine(d.slot, "evaluating…");
    else if (d.msg) setStatusLine(d.slot, d.msg);
  });
  es.addEventListener("checkpoint", e => {
    const d = JSON.parse(e.data);
    setStatusLine(d.slot, `checkpoint ${d.index} · ${pct(d.overall)}`);
    setBars(d.slot, d.per_label);
    setVal(d.slot, "bestval", pct(d.best_overall));
  });
  es.addEventListener("decision", e => {
    const d = JSON.parse(e.data);
    setStatusLine(d.slot, `decided: ${d.action}`);
  });
  es.addEventListener("done", e => {
    const d = JSON.parse(e.data);
    setStatusLine(d.slot, "done");
    setVal(d.slot, "bestval", pct(d.final_overall));
    if (d.test_overall != null) setVal(d.slot, "test", pct(d.test_overall));
    if (d.exp_id) { const b=q(d.slot,".badge"); if(b) b.innerHTML =
      `<a href="/e/${d.exp_id}" class="text-[11px] text-sky-600 hover:underline">💬 chat with this model →</a>`; }
  });
  es.addEventListener("error", e => {
    try { const d = JSON.parse(e.data); if (d.slot!=null) setStatusLine(d.slot, "error: "+(d.message||"")); } catch(_){}
  });
  es.addEventListener("swarm_done", e => {
    const d = JSON.parse(e.data);
    $status.textContent = "done";
    if (d.winner) {
      const w = d.winner;
      const badge = q(w.slot, ".badge"); if (badge) badge.innerHTML =
        `<span class="rounded-full bg-emerald-100 text-emerald-700 px-2 py-0.5 text-[11px] font-medium">🏆 winner</span>`
        + (w.exp_id ? ` <a href="/e/${w.exp_id}" class="ml-1 text-[11px] text-sky-600 hover:underline">💬 chat →</a>` : "");
      $winner.classList.remove("hidden");
      $winner.innerHTML = `<div class="rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800 flex items-center justify-between gap-4">
        <div><b>Winner: ${w.label || w.model}</b> <span class="font-mono text-xs">(${w.model.split('/').pop()})</span> — held-out test <b>${pct(w.test)}</b> (val ${pct(w.val)}).
        ${d.ranking.length>1 ? `<div class="mt-1 text-xs text-emerald-700/80">ranking: ${d.ranking.map(r=>`${r.label || r.model.split('/').pop()} ${pct(r.test ?? r.val)}`).join(" · ")}</div>`:""}</div>
        ${w.exp_id ? `<a href="/e/${w.exp_id}" class="shrink-0 rounded-xl bg-emerald-600 text-white px-4 py-2 text-sm font-medium hover:bg-emerald-700">Chat with the winner →</a>` : ""}</div>`;
    }
  });
  es.addEventListener("close", () => { es.close(); $btn.disabled=false; $btn.textContent="Re-run bake-off"; });
  es.onerror = () => { es.close(); $btn.disabled=false; $btn.textContent="Re-run bake-off"; };
}

// preload an already-run bake-off
if (SW.contenders && SW.contenders.length) renderGrid(SW.contenders);
if (SW.winner) {
  $winner.classList.remove("hidden");
  const w = SW.winner;
  $winner.innerHTML = `<div class="rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800 flex items-center justify-between gap-4">
    <div><b>Winner: ${w.label || w.model}</b> <span class="font-mono text-xs">(${w.model.split('/').pop()})</span> — held-out test <b>${pct(w.test)}</b> (val ${pct(w.val)}).</div>
    ${w.exp_id ? `<a href="/e/${w.exp_id}" class="shrink-0 rounded-xl bg-emerald-600 text-white px-4 py-2 text-sm font-medium hover:bg-emerald-700">Chat with the winner →</a>` : ""}</div>`;
}
$btn.addEventListener("click", run);
</script>
{% endblock %}
